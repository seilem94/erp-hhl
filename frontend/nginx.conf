server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Mismo origen: compilar con --build-arg VITE_API_BASE_URL=/.
        # Cuando la red disponga de backend:8000, sustituir return 503
        # por las directivas siguientes. proxy_pass SIN barra final
        # conserva /api/v1, que ya forma parte de las rutas del backend.
        return 503;
        # proxy_pass http://backend:8000;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }
}
